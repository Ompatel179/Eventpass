<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EventPass Scanner</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 0 auto; padding: 16px; }
    section { margin-bottom: 24px; }
    input, select, button { width: 100%; padding: 12px; margin-top: 8px; font-size: 16px; box-sizing: border-box; }
    #result { padding: 24px; border-radius: 12px; text-align: center; font-size: 22px; font-weight: bold; }
    .ok { background: #c8f7c5; color: #14532d; }
    .warn { background: #fde68a; color: #78350f; }
    .bad { background: #fecaca; color: #7f1d1d; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>EventPass Scanner</h1>

  <section id="login-section">
    <h2>1. Organizer login</h2>
    <form id="login-form">
      <input id="email" type="email" placeholder="Email" required>
      <input id="password" type="password" placeholder="Password" required>
      <button type="submit">Log in</button>
    </form>
  </section>

  <section id="scan-section" class="hidden">
    <h2>2. Pick an event</h2>
    <select id="event-select"></select>

    <h2>3. Scan tickets</h2>
    <button id="start-button">Start camera</button>
    <div id="reader"></div>

    <form id="manual-form">
      <input id="manual-token" placeholder="Or type a ticket code" required>
      <button type="submit">Check in</button>
    </form>
  </section>

  <div id="result" class="hidden"></div>

  <script>
    let token = null;
    let busy = false;

    const result = document.getElementById("result");

    function showResult(message, kind) {
      result.textContent = message;
      result.className = kind;
    }

    async function api(path, options = {}) {
      const headers = options.headers || {};
      if (token) headers["Authorization"] = `Bearer ${token}`;
      return fetch(path, { ...options, headers });
    }

    document.getElementById("login-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const response = await fetch("/auth/login", {
        method: "POST",
        body: new URLSearchParams({
          username: document.getElementById("email").value,
          password: document.getElementById("password").value,
        }),
      });
      if (response.status === 429) {
        showResult("Too many attempts: wait a minute", "warn");
        return;
      }
      if (!response.ok) {
        showResult("Wrong email or password", "bad");
        return;
      }
      token = (await response.json()).access_token;
      await loadEvents();
      document.getElementById("login-section").classList.add("hidden");
      document.getElementById("scan-section").classList.remove("hidden");
      result.className = "hidden";
    });

    async function loadEvents() {
      const events = await (await api("/events")).json();
      const select = document.getElementById("event-select");
      for (const ev of events) {
        const option = document.createElement("option");
        option.value = ev.id;
        option.textContent = `${ev.name} (#${ev.id})`;
        select.append(option);
      }
    }

    async function checkIn(qrToken) {
      if (busy) return;
      busy = true;
      const eventId = document.getElementById("event-select").value;
      try {
        const response = await api(`/events/${eventId}/check-ins`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ qr_token: qrToken }),
        });
        if (response.status === 201) showResult("✅ Checked in", "ok");
        else if (response.status === 409) showResult("⚠️ Already checked in", "warn");
        else if (response.status === 404) showResult("❌ Not valid for this event", "bad");
        else if (response.status === 401) showResult("Session expired: reload and log in", "bad");
        else showResult(`Error ${response.status}`, "bad");
      } catch {
        showResult("Network error: try again", "bad");
      } finally {
        setTimeout(() => { busy = false; }, 2000);
      }
    }

    document.getElementById("start-button").addEventListener("click", () => {
      const scanner = new Html5Qrcode("reader");
      scanner
        .start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (decodedText) => checkIn(decodedText))
        .catch(() => showResult("Camera not available", "bad"));
      document.getElementById("start-button").classList.add("hidden");
    });

    document.getElementById("manual-form").addEventListener("submit", (event) => {
      event.preventDefault();
      checkIn(document.getElementById("manual-token").value.trim());
    });
  </script>
</body>
</html>
