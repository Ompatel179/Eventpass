name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eventpass
          POSTGRES_PASSWORD: eventpass
          POSTGRES_DB: eventpass_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://eventpass:eventpass@localhost:5432/eventpass_test
      TEST_DATABASE_URL: postgresql+psycopg://eventpass:eventpass@localhost:5432/eventpass_test
      SECRET_KEY: ci-only-secret-not-used-anywhere-real-0123456789
      REDIS_URL: redis://localhost:6379/0
      TEST_REDIS_URL: redis://localhost:6379/1

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check migrations apply cleanly
        run: alembic upgrade head

      - name: Run tests
        run: pytest -v --cov=app --cov-report=term-missing